  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0a1e;
      min-height: 100vh;
      display: flex;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
      overflow-y: auto;
    }

    /* ═══════════════════════════════════════════
       ANIMATED LIQUID BACKGROUND
    ═══════════════════════════════════════════ */
    .liquid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .blob-wrap {
      position: absolute;
      inset: -50%;
      animation: rotate-bg 40s linear infinite;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.7;
      will-change: transform;
      animation: drift 16s ease-in-out infinite alternate;
    }

    .blob-1 { width: 700px; height: 700px; background: #a855f7; top: 10%; left: 10%; }
    .blob-2 { width: 600px; height: 600px; background: #ec4899; bottom: 10%; right: 10%; animation-duration: 20s; animation-delay: -6s; }
    .blob-3 { width: 550px; height: 550px; background: #3b82f6; top: 40%; left: 40%; animation-duration: 24s; animation-delay: -12s; }

    @keyframes rotate-bg {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    @keyframes drift {
      from { transform: translate(-60px, -40px) scale(1); }
      to   { transform: translate(60px, 50px) scale(1.12); }
    }

    .liquid-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 0%, rgba(15, 10, 30, 0.5) 100%);
    }

    /* ═══════════════════════════════════════════
       TOP LOGO PILL
    ═══════════════════════════════════════════ */
    .top-logo {
      position: fixed; top: 20px; left: 24px;
      z-index: 10;
      display: flex; align-items: center; gap: 10px;
      padding: 6px 16px 6px 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #fff;
      text-decoration: none;
      font-size: 14px; font-weight: 700; letter-spacing: -0.02em;
    }
    .top-logo-mark { width: 22px; height: 22px; object-fit: contain; display: block; }

    /* ═══════════════════════════════════════════
       PAGE WRAPPER
    ═══════════════════════════════════════════ */
    .page-wrapper {
      width: 100%;
      max-width: 1080px;
      margin: auto;
      padding-top: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 56px;
      position: relative;
      z-index: 1;
    }

    .left-side { flex: 1; min-width: 0; max-width: 520px; }
    .right-side { display: flex; justify-content: flex-end; flex-shrink: 0; width: 100%; max-width: 360px; }

    /* ═══════════════════════════════════════════
       BRAND PANEL (kiri)
    ═══════════════════════════════════════════ */
    .brand-logo { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .brand-icon {
      width: 54px; height: 54px; object-fit: contain; flex-shrink: 0; display: block;
      filter: drop-shadow(0 6px 22px rgba(168, 85, 247, 0.6));
    }
    .brand-title {
      font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
      background: linear-gradient(135deg, #fff 0%, #c084fc 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .brand-tagline { font-size: 18px; font-weight: 500; color: rgba(255,255,255,0.75); margin-bottom: 10px; }
    .brand-desc { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.5); max-width: 400px; }

    .brand-features {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      width: 380px; max-width: 100%;
    }
    .brand-feature {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .brand-feature i { color: #c084fc; font-size: 14px; width: 18px; text-align: center; }
    .brand-feature span { font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.7); }

    /* ═══════════════════════════════════════════
       3D MEMBER CARD
    ═══════════════════════════════════════════ */
    .card-stage {
      margin: 26px 0 18px;
      perspective: 1100px;
      width: 380px;
      max-width: 100%;
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { translate: 0 0; }
      50%      { translate: 0 -10px; }
    }

    .member-card {
      --gx: 50%;
      --gy: 50%;
      position: relative;
      width: 100%;
      aspect-ratio: 1.586 / 1;
      border-radius: 22px;
      transform-style: preserve-3d;
      transform: rotateX(0deg) rotateY(0deg);
      will-change: transform;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
    }

    .mc-glass {
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 100%);
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35);
    }

    .mc-scales {
      position: absolute; inset: 0;
      border-radius: inherit;
      background-image:
        radial-gradient(circle at 50% 100%, transparent 56%, rgba(255,255,255,0.13) 58%, transparent 61%),
        radial-gradient(circle at 50% 100%, transparent 56%, rgba(255,255,255,0.13) 58%, transparent 61%);
      background-size: 26px 18px;
      background-position: 0 0, 13px 9px;
      -webkit-mask-image: linear-gradient(135deg, #000 0%, transparent 70%);
      mask-image: linear-gradient(135deg, #000 0%, transparent 70%);
      pointer-events: none;
    }

    .mc-glare {
      position: absolute; inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at var(--gx) var(--gy), rgba(255,255,255,0.35) 0%, transparent 55%);
      mix-blend-mode: soft-light;
      pointer-events: none;
    }

    .mc-content {
      position: absolute; inset: 0;
      padding: 22px 26px;
      display: flex; flex-direction: column; justify-content: space-between;
      transform: translateZ(40px);
      color: #fff;
    }

    .mc-top { display: flex; align-items: center; justify-content: space-between; }
    .mc-logo { font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
    .mc-emoji { font-size: 22px; line-height: 1; }

    .mc-chip {
      width: 42px; height: 31px; border-radius: 7px;
      background: linear-gradient(135deg, #fde68a 0%, #f59e0b 100%);
      position: relative;
      opacity: 0.9;
    }
    .mc-chip::before, .mc-chip::after {
      content: ''; position: absolute; left: 0; right: 0;
      height: 1px; background: rgba(0, 0, 0, 0.25);
    }
    .mc-chip::before { top: 10px; }
    .mc-chip::after  { top: 20px; }


    .mc-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
    .mc-bottom > div { min-width: 0; }
    .mc-label { font-size: 9.5px; color: rgba(255, 255, 255, 0.6); margin-bottom: 3px; }
    .mc-name {
      font-size: 14px; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mc-email {
      font-size: 11px; color: rgba(255, 255, 255, 0.65);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-top: 2px;
    }
    .mc-val { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* ═══════════════════════════════════════════
       GLASSMORPHISM CARD (FORM)
    ═══════════════════════════════════════════ */
    .auth-card {
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 32px 28px;
      position: relative;
      overflow: hidden;
      box-shadow:
        0 25px 50px -12px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    /* ═══════════════════════════════════════════
       TYPOGRAPHY
    ═══════════════════════════════════════════ */
    .card-title { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.5px; margin-bottom: 4px; position: relative; }
    .card-sub   { font-size: 12px; color: rgba(255, 255, 255, 0.5); margin-bottom: 24px; position: relative; }

    /* ═══════════════════════════════════════════
       FORM
    ═══════════════════════════════════════════ */
    .form-group { margin-bottom: 14px; position: relative; }

    .form-group label {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 11px 13px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 10px;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: #a855f7;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.15);
    }
    .form-group input.error { border-color: #ef4444; background: rgba(239, 68, 68, 0.08); }
    .form-group input::placeholder { color: rgba(255, 255, 255, 0.3); }

    /* ═══════════════════════════════════════════
       PASSWORD TOGGLE
    ═══════════════════════════════════════════ */
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 72px; }

    .pw-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none;
      color: rgba(255, 255, 255, 0.5); font-size: 11px; font-weight: 500;
      font-family: 'Inter', sans-serif; cursor: pointer;
      padding: 4px 8px; border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .pw-toggle:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }

    /* ═══════════════════════════════════════════
       BUTTONS
    ═══════════════════════════════════════════ */
    .btn-submit {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
      color: #fff;
      border: none; border-radius: 10px;
      font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
      letter-spacing: 0.02em;
      box-shadow: 0 8px 24px -8px rgba(168, 85, 247, 0.6);
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 12px 28px -8px rgba(168, 85, 247, 0.8); }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ═══════════════════════════════════════════
       SIGN IN ROW
    ═══════════════════════════════════════════ */
    .signin-row { text-align: center; margin-top: 18px; font-size: 11.5px; color: rgba(255, 255, 255, 0.4); }
    .signin-row a { color: #c084fc; font-weight: 600; text-decoration: none; transition: color 0.15s; }
    .signin-row a:hover { color: #fff; }

    /* ═══════════════════════════════════════════
       FORM MESSAGE
    ═══════════════════════════════════════════ */
    .form-msg {
      display: none;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 11.5px;
      margin-top: 14px;
      font-weight: 500;
      text-align: center;
      line-height: 1.4;
    }
    .form-msg.ok  { display: block; background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
    .form-msg.err { display: block; background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3); }

    /* ═══════════════════════════════════════════
       LANG SWITCHER
    ═══════════════════════════════════════════ */
    .lang-switcher {
      position: fixed; top: 20px; right: 24px;
      display: flex; gap: 6px; z-index: 10;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .lang-btn {
      background: none; border: none;
      border-radius: 20px; padding: 5px 14px;
      font-size: 10px; font-weight: 600;
      cursor: pointer; transition: all 0.15s;
      color: rgba(255, 255, 255, 0.6);
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.04em;
    }
    .lang-btn.active { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); color: #fff; }
    .lang-btn:hover:not(.active) { color: #fff; }

    /* ═══════════════════════════════════════════
       KEYBOARD FOCUS
    ═══════════════════════════════════════════ */
    .btn-submit:focus-visible, .pw-toggle:focus-visible, .lang-btn:focus-visible,
    .top-logo:focus-visible, .signin-row a:focus-visible {
      outline: 2px solid #c084fc;
      outline-offset: 2px;
    }

    /* ═══════════════════════════════════════════
       SPINNER
    ═══════════════════════════════════════════ */
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ═══════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════ */
    @media (max-width: 960px) {
      .left-side { display: none; }
      .page-wrapper { max-width: 380px; justify-content: center; }
      .right-side { justify-content: center; max-width: none; }
    }

    @media (max-width: 900px) {
      .blob-1, .blob-2, .blob-3 { filter: blur(60px); opacity: 0.6; }
    }

    @media (max-width: 680px) {
      .auth-card { max-width: 100%; padding: 28px 22px; }
      .lang-switcher { top: 16px; right: 16px; }
      .top-logo      { top: 16px; left: 16px; }
      .page-wrapper  { padding-top: 56px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob-wrap, .blob, .card-stage { animation: none; }
    }

    /* ═══════════════════════════════════════════
       LOGIN-SPECIFIC
    ═══════════════════════════════════════════ */
    .form-msg.warn { display: block; background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }

    .row-between { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 20px; gap: 12px; }
    .remember-me { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: rgba(255,255,255,0.55); cursor: pointer; user-select: none; }
    .remember-me input { width: 15px; height: 15px; accent-color: #a855f7; cursor: pointer; }
    .forgot-link { font-size: 11.5px; font-weight: 500; color: #c084fc; text-decoration: none; transition: color 0.15s; }
    .forgot-link:hover { color: #fff; }
    .forgot-link:focus-visible, .remember-me input:focus-visible { outline: 2px solid #c084fc; outline-offset: 2px; }

    .mc-login .mc-glass {
      background: linear-gradient(135deg, rgba(96,165,250,0.30) 0%, rgba(168,85,247,0.10) 100%);
    }
    .mc-brand { display: flex; align-items: center; gap: 8px; }
    .mc-brand img { width: 22px; height: 22px; object-fit: contain; display: block; }
    .mc-welcome {
      font-size: clamp(20px, 2.6vw, 26px);
      font-weight: 600; line-height: 1.2; letter-spacing: -0.02em;
      text-shadow: 0 2px 8px rgba(0,0,0,0.25);
    }
    .mc-login .mc-email { font-size: 14px; font-weight: 600; color: #fff; margin-top: 0; }
  </style>
</head>

let currentLang = localStorage.getItem('klikva_lang') || 'id';

function t(key) {
  return (translations[currentLang] || translations.id)[key] || key;
}

function translatePage() {
  document.title = t('page_title');
  document.documentElement.lang = currentLang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (el.tagName === 'INPUT') { el.placeholder = t(key); return; }
    if (el === document.getElementById('loginBtn') && el.disabled) return;
    el.textContent = t(key);
  });

  const pw = document.getElementById('password');
  document.getElementById('pwToggle').textContent = pw.type === 'password' ? t('pw_show') : t('pw_hide');

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });

  updateMemberCard();
}

function setLanguage(lang) {
  if (!translations[lang]) return;
  currentLang = lang;
  localStorage.setItem('klikva_lang', lang);
  translatePage();
}

/* =================================================================
   MEMBER CARD (email live + 3D tilt)
================================================================= */
function updateMemberCard() {
  const email = document.getElementById('email').value.trim();
  document.getElementById('mcEmail').textContent = email || t('card_email_ph');
}

function setupCardTilt() {
  const card = document.getElementById('memberCard');
  if (!card) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const MAX = 28;
  let tx = 0, ty = 0, cx = 0, cy = 0, raf = null;

  function frame() {
    cx += (tx - cx) * 0.12;
    cy += (ty - cy) * 0.12;
    card.style.transform = 'rotateX(' + cy.toFixed(2) + 'deg) rotateY(' + cx.toFixed(2) + 'deg)';
    card.style.setProperty('--gx', (50 + cx * 2.5).toFixed(1) + '%');
    card.style.setProperty('--gy', (50 - cy * 2.5).toFixed(1) + '%');
    if (Math.abs(tx - cx) > 0.02 || Math.abs(ty - cy) > 0.02) {
      raf = requestAnimationFrame(frame);
    } else {
      raf = null;
    }
  }
  function kick() { if (!raf) raf = requestAnimationFrame(frame); }

  document.addEventListener('mousemove', function(e) {
    tx =  ((e.clientX / window.innerWidth)  - 0.5) * MAX;
    ty = -((e.clientY / window.innerHeight) - 0.5) * MAX;
    kick();
  });
  document.addEventListener('mouseleave', function() { tx = 0; ty = 0; kick(); });
}

/* =================================================================
   HELPER: JSONP CALL
================================================================= */
function jsonpCall(params, callback) {
  const cbName = 'klikva_cb_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);

  const cleanup = () => {
    delete window[cbName];
    const s = document.getElementById(cbName);
    if (s) document.body.removeChild(s);
  };

  window[cbName] = function(data) {
    cleanup();
    callback(null, data);
  };

  const url = new URL(SCRIPT_URL);
  Object.entries(params).forEach(([k, v]) => {
    if (v !== undefined && v !== null) url.searchParams.append(k, v);
  });
  url.searchParams.append('callback', cbName);

  const script = document.createElement('script');
  script.id    = cbName;
  script.src   = url.toString();

  const timeout = setTimeout(() => {
    cleanup();
    callback(new Error('Timeout'), null);
  }, 15000);

  script.onload  = () => clearTimeout(timeout);
  script.onerror = () => {
    clearTimeout(timeout);
    cleanup();
    callback(new Error('Network error'), null);
  };

  document.body.appendChild(script);
}

  el.textContent = msg;
  el.className = 'form-msg ' + (type === 'warning' ? 'warn' : type === 'success' ? 'ok' : 'err');
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function hideError() {
  document.getElementById('errorMessage').className = 'form-msg';
}

function handleLogin(e) {

  const email    = document.getElementById('email').value.trim().toLowerCase();
  const password = document.getElementById('password').value;
  const remember = document.getElementById('rememberMe').checked;
  const btn      = document.getElementById('loginBtn');

  if (!email)    { showError(t('err_email_req')); return; }
  if (!password) { showError(t('err_pw_req')); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
    showError(t('err_email_invalid'));
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>' + t('btn_loading');

  jsonpCall({
    action:   'login',
    email:    email,
    password: password
  }, function(err, result) {
    btn.disabled = false;
    btn.textContent = t('btn_login');

    if (err || !result) {
      showError(t('err_network'));
      return;
    }

    if (!result.success) {
      const msg = result.message || t('err_default');

      if (msg.toLowerCase().includes('verifikasi') || msg.toLowerCase().includes('verify')) {
        showError(t('warn_unverified'), 'warning');
        return;
      }

      if (msg.toLowerCase().includes('terdaftar') || msg.toLowerCase().includes('registered')) {
        showError(t('err_not_registered'), 'error');
        return;
      }

      showError('❌ ' + msg);
      return;
    }

    // ✅ Login sukses
    const user = result.user;

    const userData = {
      isLoggedIn:  true,
      email:       user.email,
      memberId:    user.memberId,
      namaLengkap: user.namaLengkap,
      whatsapp:    user.whatsapp  || '',
      kota:        user.kota      || '',
      alamat:      user.alamat    || '',
      kecamatan:   user.kecamatan || '',
      kodePos:     user.kodePos   || '',
      isVerified:  true,
      timestamp:   new Date().toLocaleString('id-ID'),
      remember:    remember
    };

    localStorage.setItem('klikva_user', JSON.stringify(userData));

    if (user.whatsapp && user.kota && user.alamat) {
      localStorage.setItem('klikva_profile', JSON.stringify({
        whatsapp:  user.whatsapp,
        kota:      user.kota,
        alamat:    user.alamat,
        kecamatan: user.kecamatan,
        kodePos:   user.kodePos
      }));
    }

    showError(t('ok_success'), 'success');

    setTimeout(() => {
      const pendingBuy = localStorage.getItem('klikva_pending_buy');
      if (pendingBuy) {
        localStorage.removeItem('klikva_pending_buy');
        window.location.href = 'shop.html';
      } else {
        window.location.href = 'index.html';
      }
    }, 800);
  });
}

   INIT
================================================================= */
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
  });

  document.getElementById('pwToggle').addEventListener('click', function() {
    const inp = document.getElementById('password');
    const hidden = inp.type === 'password';
    inp.type = hidden ? 'text' : 'password';
    this.textContent = hidden ? t('pw_hide') : t('pw_show');
  });

  document.getElementById('loginForm').addEventListener('submit', handleLogin);

  document.getElementById('password').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('loginForm').requestSubmit();
    }
  });

  document.getElementById('email').addEventListener('input', function() {
    hideError();
    updateMemberCard();
  });
  document.getElementById('password').addEventListener('input', hideError);

  setupCardTilt();
  translatePage();

  const emailInput = document.getElementById('email');
  if (emailInput && !emailInput.value) {
    setTimeout(() => emailInput.focus(), 300);
  }
});
</script>
