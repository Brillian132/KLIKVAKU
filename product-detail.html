<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detail Produk — Klikva</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#FAF9F6;--bg-card:#fff;--text:#1A1A1A;--text-secondary:#555;--text-light:#999;--border:#E8E6E1;--shadow-hover:0 12px 40px rgba(0,0,0,.08);--radius:20px;--font:'Space Grotesk',sans-serif;--nav-bg:rgba(255,255,255,.88)}
[data-theme="dark"]{--bg:#121212;--bg-card:#1E1E1E;--text:#EDEDED;--text-secondary:#AAA;--text-light:#777;--border:#2A2A2A;--shadow-hover:0 12px 40px rgba(0,0,0,.3);--nav-bg:rgba(18,18,18,.92)}
body{font-family:var(--font);background:var(--bg);color:var(--text);transition:background .3s,color .3s;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
ul{list-style:none}
.wrap{max-width:1400px;margin:0 auto;padding:0 24px}

/* NAVBAR */
#navbar{position:fixed;top:0;left:0;right:0;z-index:1000;padding:0 24px;background:var(--nav-bg);backdrop-filter:blur(20px);box-shadow:0 1px 0 var(--border)}
.nav-inner{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:68px}
.nav-logo{font-size:1.25rem;font-weight:800;letter-spacing:-.04em}.nav-logo span{color:var(--text-light);font-weight:400}
.nav-actions{display:flex;align-items:center;gap:12px}
.search-wrapper{display:flex;align-items:center;position:relative;height:40px;background:var(--bg);border:1.5px solid var(--border);border-radius:50px;padding:0 6px;transition:all .5s cubic-bezier(.25,.8,.25,1);width:42px;cursor:pointer;z-index:10}
.search-wrapper.active{width:clamp(300px,45vw,600px);background:var(--bg-card);border-color:var(--text);cursor:text;box-shadow:0 4px 12px rgba(0,0,0,.05)}
.search-icon-btn{background:transparent;border:none;color:var(--text);padding:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.search-input{width:0;opacity:0;border:none;background:transparent;color:var(--text);font-size:.85rem;outline:none;padding:0;transition:all .5s cubic-bezier(.25,.8,.25,1);font-family:var(--font);flex-grow:1}
.search-wrapper.active .search-input{width:100%;opacity:1;padding:0 8px}
.close-btn{background:transparent;border:none;color:var(--text-light);cursor:pointer;opacity:0;width:0;padding:0;transition:all .5s;flex-shrink:0;font-size:.9rem}
.search-wrapper.active .close-btn{opacity:1;width:auto;padding:8px}
.btn-ghost{font-size:.875rem;font-weight:500;padding:9px 18px;border-radius:50px;border:1.5px solid var(--border);transition:border-color .2s,background .2s}
.btn-ghost:hover{border-color:var(--text)}
.btn-solid{font-size:.875rem;font-weight:600;color:var(--bg);padding:9px 20px;border-radius:50px;background:var(--text);transition:opacity .2s,transform .2s}
.btn-solid:hover{opacity:.8;transform:scale(1.03)}
.theme-btn{border:1.5px solid var(--border);border-radius:50px;padding:6px 12px;font-size:.95rem}
.theme-btn:hover{border-color:var(--text)}
.cart-link{position:relative;padding:8px;font-size:1.4rem;transition:transform .2s}
.cart-link:hover{transform:scale(1.1)}
.cart-badge{position:absolute;top:0;right:0;background:#ef4444;color:#fff;font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:50%;min-width:18px;text-align:center}
.cart-badge.bounce{animation:bb .5s ease}@keyframes bb{50%{transform:scale(1.5)}}
.avatar-nav{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 8px 4px 4px;border-radius:50px}
.avatar-nav:hover{background:var(--bg)}
.avatar-nav-image{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--bg)}
.avatar-nav-name{font-size:.8rem;font-weight:500;max-width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hamburger{display:none;flex-direction:column;gap:5px;padding:8px}
.hamburger span{width:22px;height:1.5px;background:var(--text)}
.mobile-nav{position:fixed;inset:0;z-index:999;background:var(--bg);padding:80px 24px 40px;display:flex;flex-direction:column;gap:8px;transform:translateX(100%);transition:transform .35s}
.mobile-nav.open{transform:none}
.mobile-nav a{font-size:1.5rem;font-weight:700;padding:14px 0;border-bottom:1px solid var(--border)}
.mobile-nav .mobile-nav-btns{margin-top:24px;display:flex;flex-direction:column;gap:12px}
.mobile-nav .btn-solid,.mobile-nav .btn-ghost{text-align:center;padding:14px;border-radius:16px;font-size:1rem;border-bottom:0}

/* ─── MAIN LAYOUT ─── */
.product-page { padding-top: 100px; padding-bottom: 60px; }

/* Breadcrumb */
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: .8rem; color: var(--text-light); margin-bottom: 24px; flex-wrap: wrap; }
.breadcrumb a { color: var(--text-secondary); transition: color .2s; }
.breadcrumb a:hover { color: var(--text); }
.breadcrumb-sep { opacity: .5; }

/* Grid 2 kolom */
.product-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: start; }

/* ─── KIRI: GAMBAR ─── */
.product-image-wrap { position: relative; border-radius: 28px; overflow: hidden; background: var(--bg-card); border: 1px solid var(--border); aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-hover); }
.product-image-wrap img { width: 100%; height: 100%; object-fit: contain; padding: 32px; }
.product-image-emoji { font-size: 10rem; line-height: 1; filter: drop-shadow(0 20px 40px rgba(0,0,0,.15)); }
.sale-badge-lg { position: absolute; top: 20px; left: 20px; background: #DC2626; color: #fff; font-size: .75rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; letter-spacing: .04em; text-transform: uppercase; }
.stock-badge-lg { position: absolute; top: 20px; right: 20px; font-size: .7rem; font-weight: 700; padding: 6px 14px; border-radius: 20px; border: 1px solid; }
.stock-badge-lg.ok    { background: #ECFDF5; color: #059669; border-color: #A7F3D0; }
.stock-badge-lg.low   { background: #FFFBEB; color: #D97706; border-color: #FDE68A; }
.stock-badge-lg.out   { background: #FEF2F2; color: #DC2626; border-color: #FECACA; }
[data-theme="dark"] .stock-badge-lg.ok  { background: rgba(5,150,105,.15); }
[data-theme="dark"] .stock-badge-lg.low { background: rgba(217,119,6,.15); }
[data-theme="dark"] .stock-badge-lg.out { background: rgba(220,38,38,.15); }

/* ─── KANAN: INFO ─── */
.product-category-tag { display: inline-block; font-size: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--text-light); margin-bottom: 12px; }
.product-title-lg { font-size: clamp(1.6rem, 3vw, 2.2rem); font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 18px; }
.product-price-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
.product-price-lg { font-size: 1.9rem; font-weight: 800; letter-spacing: -0.02em; }
.product-price-old { font-size: 1.1rem; font-weight: 500; color: var(--text-light); text-decoration: line-through; }
.product-discount-tag { font-size: .75rem; font-weight: 700; color: #DC2626; background: #FEF2F2; padding: 3px 10px; border-radius: 8px; }
[data-theme="dark"] .product-discount-tag { background: rgba(220,38,38,.15); }

.product-desc { font-size: .95rem; line-height: 1.7; color: var(--text-secondary); margin-bottom: 28px; padding-bottom: 28px; border-bottom: 1px solid var(--border); }

/* Quantity selector */
.qty-row { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.qty-label { font-size: .85rem; font-weight: 600; color: var(--text-secondary); }
.qty-selector { display: flex; align-items: center; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 50px; padding: 4px; }
.qty-btn { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: 600; color: var(--text); transition: background .15s; }
.qty-btn:hover:not(:disabled) { background: var(--bg); }
.qty-btn:disabled { opacity: .3; cursor: not-allowed; }
.qty-value { min-width: 48px; text-align: center; font-weight: 700; font-size: 1rem; font-variant-numeric: tabular-nums; }

/* Benefits list */
.benefits { display: flex; flex-direction: column; gap: 12px; padding-top: 24px; border-top: 1px solid var(--border); margin-top: 24px; }
.benefit-item { display: flex; align-items: center; gap: 12px; font-size: .85rem; color: var(--text-secondary); }
.benefit-item i { font-style: normal; width: 32px; height: 32px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: .9rem; }

/* ─── PRODUK SERUPA ─── */
.related-section { margin-top: 80px; padding-top: 48px; border-top: 1px solid var(--border); }
.related-title { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 24px; }
.related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
.related-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; cursor: pointer; transition: transform .3s, box-shadow .3s; }
.related-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }
.related-img { aspect-ratio: 1; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 4rem; position: relative; }
.related-img img { width: 100%; height: 100%; object-fit: contain; padding: 16px; }
.related-body { padding: 14px; }
.related-name { font-size: .85rem; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.related-price { font-size: .95rem; font-weight: 700; }

/* Loading & Error */
.loading-page, .error-page { text-align: center; padding: 80px 20px; }
.loading-spinner { display: inline-block; width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--text); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.error-page .error-icon { font-size: 4rem; margin-bottom: 16px; opacity: .5; }
.error-page h2 { font-size: 1.4rem; margin-bottom: 8px; }
.error-page p { color: var(--text-light); margin-bottom: 20px; }
.back-btn { display: inline-block; padding: 12px 28px; background: var(--text); color: var(--bg); border-radius: 50px; font-weight: 600; font-size: .9rem; transition: opacity .2s; }
.back-btn:hover { opacity: .8; }

/* Toast */
.toast-avatar{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#111;color:#fff;padding:14px 28px;border-radius:50px;font-size:.9rem;font-weight:500;z-index:9999;opacity:0;transition:all .5s cubic-bezier(.68,-.55,.265,1.55);pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.toast-avatar.show{opacity:1;transform:translateX(-50%)}

/* ═══════════════════════════════════════════
   ADD TO CART — ANIMASI (sama dengan shop.html)
═══════════════════════════════════════════ */
.add-to-cart{position:relative;width:100%;max-width:340px;height:54px;border:none;background:none;padding:0;cursor:pointer;font-family:var(--font);outline:none;-webkit-tap-highlight-color:transparent;overflow:visible;display:block;margin:0 0 24px}
.atc-pill{position:absolute;inset:0;border-radius:14px;background:#17171B;transition:background .4s ease}
[data-theme="dark"] .atc-pill{background:#2C2C30;box-shadow:inset 0 0 0 1px #3d3d42}
.atc-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;z-index:3;pointer-events:none;white-space:nowrap;user-select:none;letter-spacing:0.02em}
.atc-cart{position:absolute;top:50%;transform:translateY(-50%);z-index:3;pointer-events:none}.atc-cart svg{width:28px;height:20px;display:block;overflow:visible}
.atc-cart path.shape{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.atc-cart path.wheel{fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round}
.atc-cart path.tick{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:11px;stroke-dashoffset:11px}
.atc-item{position:absolute;left:50%;transform:translateX(-50%);font-size:18px;z-index:5;pointer-events:none;line-height:1;user-select:none}
.add-to-cart:not(.atc-busy):not(.atc-out):hover .atc-pill{background:#2d2d35}
[data-theme="dark"] .add-to-cart:not(.atc-busy):not(.atc-out):hover .atc-pill{background:#3a3a40}
.add-to-cart.atc-out{cursor:not-allowed;opacity:.75;pointer-events:none}
.add-to-cart.atc-out .atc-pill{background:#DC2626}

/* Modal Profil */
.modal-overlay{position:fixed;inset:0;z-index:2000;background:rgba(15,10,30,.75);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s ease}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-card{width:100%;max-width:480px;max-height:90vh;overflow-y:auto;background:linear-gradient(135deg,#1a1030 0%,#2a1040 100%);border:1px solid rgba(168,85,247,.3);border-radius:24px;padding:32px;position:relative;box-shadow:0 25px 70px -12px rgba(0,0,0,.7);transform:translateY(20px) scale(.95);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.modal-overlay.show .modal-card{transform:translateY(0) scale(1)}
.modal-card::before{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(168,85,247,.15) 0%,transparent 60%);pointer-events:none;border-radius:inherit}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;z-index:2}
.modal-close:hover{background:rgba(255,255,255,.15);color:#fff}
.modal-header{text-align:center;margin-bottom:24px;position:relative;z-index:1}
.modal-icon{font-size:40px;margin-bottom:10px;filter:drop-shadow(0 0 20px rgba(168,85,247,.5))}
.modal-title{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.02em;margin-bottom:6px}
.modal-sub{font-size:13px;color:rgba(255,255,255,.55);line-height:1.5}
.profile-form{position:relative;z-index:1}
.pf-group{margin-bottom:16px}
.pf-group label{display:block;font-size:10.5px;font-weight:700;color:rgba(255,255,255,.6);letter-spacing:.08em;text-transform:uppercase;margin-bottom:7px}
.pf-group label .req{color:#ec4899}
.pf-group input,.pf-group textarea{width:100%;padding:12px 14px;font-family:var(--font);font-size:13.5px;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;outline:none;transition:all .2s;resize:none}
.pf-group input:focus,.pf-group textarea:focus{border-color:#a855f7;background:rgba(255,255,255,.1);box-shadow:0 0 0 3px rgba(168,85,247,.15)}
.pf-group input.error,.pf-group textarea.error{border-color:#ef4444;background:rgba(239,68,68,.08)}
.pf-group input::placeholder,.pf-group textarea::placeholder{color:rgba(255,255,255,.3)}
.pf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pf-submit{width:100%;padding:14px;background:linear-gradient(135deg,#a855f7 0%,#ec4899 100%);color:#fff;border:none;border-radius:12px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.02em;transition:all .2s;box-shadow:0 8px 24px -8px rgba(168,85,247,.6);margin-top:8px}
.pf-submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 28px -8px rgba(168,85,247,.85)}
.pf-submit:disabled{opacity:.6;cursor:not-allowed}
.pf-cancel{width:100%;padding:10px;background:transparent;color:rgba(255,255,255,.5);border:none;border-radius:10px;font-family:var(--font);font-size:12px;font-weight:500;cursor:pointer;margin-top:6px;transition:color .2s}
.pf-cancel:hover{color:#fff}

/* Responsive */
@media (max-width: 900px) {
  .product-grid { grid-template-columns: 1fr; gap: 32px; }
  .product-image-emoji { font-size: 7rem; }
  .related-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
}
@media (max-width: 768px) {
  .nav-actions > *:not(.cart-link):not(#navAvatarContainer):not(.hamburger) { display: none; }
  .hamburger { display: flex; }
  .product-page { padding-top: 84px; }
}
@media (max-width: 520px) {
  .modal-card { padding: 26px 22px; }
  .modal-title { font-size: 19px; }
  .pf-row { grid-template-columns: 1fr; gap: 0; }
  .product-price-lg { font-size: 1.6rem; }
  .add-to-cart { max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<nav id="navbar"><div class="nav-inner">
  <a href="index.html" class="nav-logo">Klikva<span>.</span></a>
  <div class="nav-actions">
    <div class="search-wrapper" id="searchWrapper">
      <button class="search-icon-btn" id="searchBtn" aria-label="Cari produk">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
      <input type="text" class="search-input" id="searchInput" placeholder="Cari produk...">
      <button class="close-btn" id="closeBtn" aria-label="Tutup">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>
    <div id="navAvatarContainer"></div>
    <button class="theme-btn" id="themeBtn" aria-label="Ganti tema">🌓</button>
    <a href="cart.html" class="cart-link">🛒<span class="cart-badge" id="cartBadge">0</span></a>
    <a href="registerd.html" class="btn-ghost" id="loginBtn">Masuk</a>
    <a href="shop.html" class="btn-solid">Belanja</a>
  </div>
  <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
</div></nav>
<div class="mobile-nav" id="mobileNav">
  <a href="shop.html">Produk</a><a href="index.html#brand">Kenapa Klikva</a><a href="index.html#services">Layanan</a><a href="index.html#gallery">Ulasan</a>
  <div class="mobile-nav-btns" id="mobileNavBtns"><a href="registerd.html" class="btn-ghost">Masuk</a><a href="shop.html" class="btn-solid">Belanja Sekarang</a></div>
</div>

<main class="wrap product-page" id="productPage">
  <div class="loading-page">
    <div class="loading-spinner"></div>
    <p style="color: var(--text-light)">Memuat produk...</p>
  </div>
</main>

<!-- MODAL LENGKAPI PROFIL -->
<div class="modal-overlay" id="profileModal">
  <div class="modal-card">
    <button class="modal-close" onclick="closeProfileModal()" aria-label="Tutup">✕</button>
    <div class="modal-header">
      <div class="modal-icon">🛒</div>
      <h2 class="modal-title">Lengkapi Profil</h2>
      <p class="modal-sub">Isi data pengiriman untuk melanjutkan pembelian</p>
    </div>
    <form class="profile-form" id="profileForm" novalidate>
      <div class="pf-group">
        <label>WhatsApp <span class="req">*</span></label>
        <input type="tel" id="pfWhatsapp" placeholder="0812xxxxxxxxxx" inputmode="numeric" required>
      </div>
      <div class="pf-group">
        <label>Kota <span class="req">*</span></label>
        <input type="text" id="pfKota" placeholder="Contoh: Jakarta" required>
      </div>
      <div class="pf-group">
        <label>Alamat Lengkap <span class="req">*</span></label>
        <textarea id="pfAlamat" rows="3" placeholder="Jl. Merdeka No. 123, RT 01/RW 02..." required></textarea>
      </div>
      <div class="pf-row">
        <div class="pf-group">
          <label>Kecamatan <span class="req">*</span></label>
          <input type="text" id="pfKecamatan" placeholder="Menteng" required>
        </div>
        <div class="pf-group">
          <label>Kode Pos <span class="req">*</span></label>
          <input type="text" id="pfKodePos" placeholder="10310" inputmode="numeric" required>
        </div>
      </div>
      <button type="submit" class="pf-submit" id="pfSubmitBtn">Simpan & Lanjut Belanja →</button>
      <button type="button" class="pf-cancel" onclick="closeProfileModal()">Nanti saja</button>
    </form>
  </div>
</div>

<div class="toast-avatar" id="toastAvatar"></div>

<script>
/* =================================================================
   KONFIGURASI
================================================================= */
const API_URL  = 'https://script.google.com/macros/s/AKfycbzq6dz2VYtO1iWu_U6H02jZSWQBZ3Lvu9EKra8Z2QUMy7UtOG_UVM2WeUeT1nne1Kz_/exec';
const API_AUTH = 'https://script.google.com/macros/s/AKfycbxeyzjupP-kTO6Bq3q8Sax7lYGk08vs3Wmmt4dlSGe5tjL5m_UmPTXEZq60jIuhnhePLA/exec';

let currentProduct = null;
let relatedProducts = [];
let selectedQty = 1;
let allProducts = [];
let pendingProductId = null;
let pendingQty = 1;

/* =================================================================
   TEMA
================================================================= */
if (localStorage.getItem('klikva_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (dark) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'dark');
  localStorage.setItem('klikva_theme', dark ? 'light' : 'dark');
});

/* =================================================================
   SEARCH BAR
================================================================= */
const searchWrapper = document.getElementById('searchWrapper');
const searchBtn = document.getElementById('searchBtn');
const searchInput = document.getElementById('searchInput');
const closeBtn = document.getElementById('closeBtn');

searchBtn.addEventListener('click', (e) => { e.stopPropagation(); searchWrapper.classList.add('active'); searchInput.focus(); });
closeBtn.addEventListener('click', (e) => { e.stopPropagation(); searchWrapper.classList.remove('active'); searchInput.value = ''; });
searchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const q = searchInput.value.trim();
    if (q) window.location.href = 'shop.html?q=' + encodeURIComponent(q);
  }
});

/* =================================================================
   HELPER: JSONP
================================================================= */
function authCall(params, callback) {
  const cbName = 'klikva_auth_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
  const cleanup = () => { delete window[cbName]; const s = document.getElementById(cbName); if (s) document.body.removeChild(s); };
  window[cbName] = (data) => { cleanup(); callback(null, data); };

  const url = new URL(API_AUTH);
  Object.entries(params).forEach(([k, v]) => { if (v !== undefined && v !== null) url.searchParams.append(k, v); });
  url.searchParams.append('callback', cbName);

  const script = document.createElement('script');
  script.id = cbName; script.src = url.toString();
  const timeout = setTimeout(() => { cleanup(); callback(new Error('Timeout'), null); }, 15000);
  script.onload = () => clearTimeout(timeout);
  script.onerror = () => { clearTimeout(timeout); cleanup(); callback(new Error('Network'), null); };
  document.body.appendChild(script);
}

/* =================================================================
   TOAST
================================================================= */
function showToast(message, type = 'info') {
  const el = document.getElementById('toastAvatar');
  el.textContent = message; el.className = 'toast-avatar show';
  el.style.background = {warning:'#D97706', error:'#DC2626', success:'#059669', info:'#111111'}[type] || '#111111';
  clearTimeout(el._t); el._t = setTimeout(() => { el.className = 'toast-avatar'; el.style.background = '#111111'; }, 2800);
}

/* =================================================================
   KERANJANG
================================================================= */
function getCart() { return JSON.parse(localStorage.getItem('klikva_cart') || '[]'); }
function saveCart(cart) { localStorage.setItem('klikva_cart', JSON.stringify(cart)); updateCartBadge(); }
function updateCartBadge() {
  const total = getCart().reduce((s, i) => s + i.quantity, 0), badge = document.getElementById('cartBadge');
  if (!badge) return;
  badge.textContent = total; badge.style.display = total > 0 ? 'block' : 'none';
  if (total > 0) { badge.classList.remove('bounce'); void badge.offsetWidth; badge.classList.add('bounce'); }
}
function checkStock(p, qty) {
  if (p.stock === null || p.stock === undefined) return {status:'ok'};
  if (p.stock === 0) return {status:'out', stock:0};
  if (qty > p.stock) return {status:'out', stock:p.stock};
  if (p.stock <= 3) return {status:'low', stock:p.stock};
  return {status:'ok', stock:p.stock};
}

/* =================================================================
   NAVBAR AVATAR
================================================================= */
function renderNavbarAvatar() {
  const container = document.getElementById('navAvatarContainer');
  const loginBtn = document.getElementById('loginBtn');
  const user = localStorage.getItem('klikva_user');
  if (user) {
    const u = JSON.parse(user);
    const initial = (u.namaLengkap || 'M').charAt(0).toUpperCase();
    const name = (u.namaLengkap || 'Member').split(' ')[0];
    container.innerHTML = `<div class="avatar-nav" onclick="window.location.href='dashboard.html'"><div class="avatar-nav-image"><span>${initial}</span></div><span class="avatar-nav-name">${name}</span></div>`;
    if (loginBtn) loginBtn.style.display = 'none';
  } else {
    container.innerHTML = '';
    if (loginBtn) loginBtn.style.display = '';
  }
}

/* =================================================================
   MOBILE NAV
================================================================= */
const hamburger = document.getElementById('hamburger'), mobileNav = document.getElementById('mobileNav'); let menuOpen = false;
hamburger.addEventListener('click', () => { menuOpen = !menuOpen; mobileNav.classList.toggle('open', menuOpen); document.body.style.overflow = menuOpen ? 'hidden' : ''; });
mobileNav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => { menuOpen = false; mobileNav.classList.remove('open'); document.body.style.overflow = ''; }));

/* =================================================================
   LOAD PRODUK
================================================================= */
async function loadProductFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'), 10);

  if (!id) return showError('Produk tidak ditemukan', 'Parameter ID tidak ada di URL.');

  try {
    const cache = localStorage.getItem('kv_products_cache');
    let products = [];
    if (cache) {
      products = JSON.parse(cache);
    } else {
      const result = await (await fetch(`${API_URL}?action=getProducts`)).json();
      if (result.success && result.data) {
        products = result.data;
        localStorage.setItem('kv_products_cache', JSON.stringify(products));
      } else {
        return showError('Gagal memuat produk', result.message || 'Coba lagi nanti');
      }
    }

    allProducts = products;
    const product = products.find(p => p.id === id);
    if (!product) return showError('Produk tidak ditemukan', 'Produk dengan ID tersebut tidak ada.');

    currentProduct = product;
    relatedProducts = products.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);

    renderProduct();
  } catch (e) {
    showError('Gagal terhubung ke server', 'Periksa koneksi internet kamu.');
  }
}

/* =================================================================
   RENDER HALAMAN
================================================================= */
function renderProduct() {
  const p = currentProduct;
  const st = checkStock(p, 1);
  const isOut = st.status === 'out';
  const isLow = st.status === 'low';
  const discount = p.oldPrice && p.oldPrice > p.price
    ? Math.round((1 - p.price / p.oldPrice) * 100)
    : 0;

  const imgHtml = p.image && p.image.startsWith('data:')
    ? `<img src="${p.image}" alt="${p.name}">`
    : `<span class="product-image-emoji">${p.image || '📦'}</span>`;

  let stockBadge = '';
  if (isOut) stockBadge = '<span class="stock-badge-lg out">🚫 Stok Habis</span>';
  else if (isLow) stockBadge = `<span class="stock-badge-lg low">⚠️ Sisa ${p.stock}</span>`;
  else if (p.stock != null) stockBadge = `<span class="stock-badge-lg ok">✓ Stok ${p.stock}</span>`;

  const saleBadge = p.sale ? '<span class="sale-badge-lg">🔥 Sale</span>' : '';

  const oldPriceHtml = p.oldPrice && p.oldPrice > p.price
    ? `<span class="product-price-old">Rp ${p.oldPrice.toLocaleString('id-ID')}</span>`
    : '';
  const discountHtml = discount > 0 ? `<span class="product-discount-tag">-${discount}%</span>` : '';

  const relatedHtml = relatedProducts.length > 0 ? `
    <section class="related-section">
      <h2 class="related-title">Produk Serupa</h2>
      <div class="related-grid">
        ${relatedProducts.map(r => {
          const rImg = r.image && r.image.startsWith('data:')
            ? `<img src="${r.image}" alt="${r.name}">`
            : `${r.image || '📦'}`;
          return `
            <div class="related-card" onclick="window.location.href='product-detail.html?id=${r.id}'">
              <div class="related-img">${rImg}</div>
              <div class="related-body">
                <div class="related-name">${r.name}</div>
                <div class="related-price">Rp ${r.price.toLocaleString('id-ID')}</div>
              </div>
            </div>`;
        }).join('')}
      </div>
    </section>
  ` : '';

  const catName = p.category || 'Produk';

  document.getElementById('productPage').innerHTML = `
    <div class="breadcrumb">
      <a href="index.html">Home</a>
      <span class="breadcrumb-sep">/</span>
      <a href="shop.html">Shop</a>
      <span class="breadcrumb-sep">/</span>
      <a href="shop.html">${catName}</a>
      <span class="breadcrumb-sep">/</span>
      <span>${p.name.length > 30 ? p.name.substring(0, 30) + '...' : p.name}</span>
    </div>

    <div class="product-grid">
      <div>
        <div class="product-image-wrap">
          ${imgHtml}
          ${saleBadge}
          ${stockBadge}
        </div>
      </div>

      <div>
        <div class="product-category-tag">${p.category}</div>
        <h1 class="product-title-lg">${p.name}</h1>
        
        <div class="product-price-row">
          <span class="product-price-lg">Rp ${p.price.toLocaleString('id-ID')}</span>
          ${oldPriceHtml}
          ${discountHtml}
        </div>

        <p class="product-desc">
          ${p.description || 'Produk premium dari Klikva. Dijamin kualitas dan keasliannya. Dikirim dengan pengemasan aman dan suhu terkontrol untuk memastikan kondisi terbaik saat sampai di tangan kamu.'}
        </p>

        <div class="qty-row">
          <span class="qty-label">Jumlah:</span>
          <div class="qty-selector">
            <button class="qty-btn" id="qtyMinus" ${isOut ? 'disabled' : ''}>−</button>
            <span class="qty-value" id="qtyValue">1</span>
            <button class="qty-btn" id="qtyPlus" ${isOut ? 'disabled' : ''}>+</button>
          </div>
        </div>

        <button class="add-to-cart${isOut ? ' atc-out' : ''}" id="addToCartBtn" data-product-id="${p.id}">
          <div class="atc-pill"></div>
          <div class="atc-item" style="opacity:0;top:-38px;transform:translateX(-50%) scale(1);">📦</div>
          <div class="atc-cart" style="opacity:0;left:12px;">
            <svg viewBox="0 0 30 22">
              <path d="M1 2H5L8.5 16H21L24 6.5L6.5 6.5" class="shape"/>
              <path d="M10 20.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3Z" class="wheel"/>
              <path d="M20.5 20.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3Z" class="wheel"/>
              <path d="M12 11.5L14 13.5L18.5 9" class="tick atc-tick" style="stroke-dasharray:11px;stroke-dashoffset:11px;"/>
            </svg>
          </div>
          <div class="atc-text">${isOut ? 'Stok Habis' : 'Tambah ke Keranjang'}</div>
        </button>

        <div class="benefits">
          <div class="benefit-item"><i>🩺</i><span>Garansi kesehatan 30 hari</span></div>
          <div class="benefit-item"><i>📦</i><span>Pengiriman aman & suhu terkontrol</span></div>
          <div class="benefit-item"><i>✅</i><span>100% original dari breeder lokal</span></div>
          <div class="benefit-item"><i>💬</i><span>Konsultasi gratis via WhatsApp</span></div>
        </div>
      </div>
    </div>

    ${relatedHtml}
  `;

  // Setup qty buttons
  const maxQ = p.stock != null ? p.stock : 99;
  document.getElementById('qtyMinus').addEventListener('click', () => { if (selectedQty > 1) { selectedQty--; updateQty(); } });
  document.getElementById('qtyPlus').addEventListener('click', () => { if (selectedQty < maxQ) { selectedQty++; updateQty(); } });
  document.getElementById('addToCartBtn').addEventListener('click', function() {
    handleBeli(currentProduct.id, this, selectedQty);
  });

  updateCartBadge();
}

function updateQty() {
  document.getElementById('qtyValue').textContent = selectedQty;
  const p = currentProduct;
  const maxQ = p.stock != null ? p.stock : 99;
  document.getElementById('qtyMinus').disabled = selectedQty <= 1;
  document.getElementById('qtyPlus').disabled = selectedQty >= maxQ;
}

/* =================================================================
   ERROR PAGE
================================================================= */
function showError(title, msg) {
  document.getElementById('productPage').innerHTML = `
    <div class="error-page">
      <div class="error-icon">😕</div>
      <h2>${title}</h2>
      <p>${msg}</p>
      <a href="shop.html" class="back-btn">← Kembali ke Shop</a>
    </div>
  `;
}

/* =================================================================
   ADD TO CART — ANIMASI (sama dengan shop.html)
================================================================= */
function setS(el, props) { Object.assign(el.style, props); }
function animEl(el, from, to, duration, easing, delay) {
  return new Promise(resolve => { setTimeout(() => {
    setS(el, {transition:'none', ...from}); void el.offsetHeight;
    setS(el, {transition:`all ${duration}ms ${easing}`, ...to}); setTimeout(resolve, duration);
  }, delay || 0); });
}

async function addToCartAnimated(productId, btnEl, qty) {
  qty = qty || 1;
  const product = allProducts.find(p => p.id === productId);
  if (!product) return;
  const btn = btnEl || document.querySelector(`.add-to-cart[data-product-id="${productId}"]`);
  if (!btn || btn.classList.contains('atc-busy') || btn.classList.contains('atc-out')) return;

  const cart = getCart(), existing = cart.find(i => i.id === productId), currentQty = existing ? existing.quantity : 0;
  if (product.stock !== null && product.stock !== undefined && currentQty + qty > product.stock) {
    showToast(`⚠️ Stok hanya tersisa ${product.stock}`, 'warning');
    return;
  }

  btn.classList.add('atc-busy');
  const pill = btn.querySelector('.atc-pill'), txt = btn.querySelector('.atc-text'), cartEl = btn.querySelector('.atc-cart'), itemEl = btn.querySelector('.atc-item'), tickEl = btn.querySelector('.atc-tick');
  const categoryEmoji = {REPTILE:'🐍',CLOTHING:'👕',ACCESSORIES:'💎',SNEAKERS:'👟',ELECTRONICS:'📱',COSMETICS:'💄'};
  itemEl.textContent = categoryEmoji[product.category] || '📦';

  await animEl(txt, {opacity:'1', transform:'translateY(0)'}, {opacity:'0', transform:'translateY(4px)'}, 180, 'ease');
  setS(cartEl, {transition:'none', opacity:'1', left:'12px'}); void cartEl.offsetHeight;
  setS(cartEl, {transition:'left 0.45s cubic-bezier(0.34,1.5,0.64,1)', left:'calc(50% - 14px)'});
  await new Promise(r => setTimeout(r, 460));
  setS(itemEl, {transition:'none', opacity:'1', top:'-38px', transform:'translateX(-50%) scale(1) rotate(0deg)'}); void itemEl.offsetHeight;
  setS(itemEl, {transition:'top 0.38s cubic-bezier(0.55,0,1,0.55), transform 0.38s ease, opacity 0.1s ease 0.28s', top:'14px', transform:'translateX(-50%) scale(0.35) rotate(15deg)', opacity:'0'});
  await new Promise(r => setTimeout(r, 400));
  if (tickEl) { setS(tickEl, {transition:'stroke-dashoffset 0.32s ease'}); tickEl.style.strokeDashoffset = '0px'; }
  await new Promise(r => setTimeout(r, 360));

  if (existing) { existing.quantity += qty; showToast(`📦 ${product.name.substring(0, 28)}... +${qty} di keranjang`, 'success'); }
  else { cart.push({id:product.id, quantity:qty}); showToast(`🛒 ${product.name.substring(0, 28)}... ditambahkan!`, 'success'); }
  saveCart(cart);

  setS(pill, {transition:'background 0.35s ease', background:'#16a34a'});
  setS(cartEl, {transition:'opacity 0.2s ease', opacity:'0'});
  await new Promise(r => setTimeout(r, 220));
  txt.textContent = '✓ Ditambahkan!';
  await animEl(txt, {opacity:'0', transform:'translateY(-4px)'}, {opacity:'1', transform:'translateY(0)'}, 220, 'ease');
  await new Promise(r => setTimeout(r, 2200));
  setS(pill, {transition:'background 0.3s ease', background:''});
  txt.textContent = 'Tambah ke Keranjang';
  setS(cartEl, {transition:'none', opacity:'0', left:'12px'});
  setS(itemEl, {transition:'none', opacity:'0', top:'-38px', transform:'translateX(-50%) scale(1)'});
  if (tickEl) { setS(tickEl, {transition:'none'}); tickEl.style.strokeDashoffset = '11px'; }
  btn.classList.remove('atc-busy');
}

/* =================================================================
   HANDLE BELI
================================================================= */
async function handleBeli(productId, btnEl, qty) {
  qty = qty || 1;
  const userRaw = localStorage.getItem('klikva_user');
  if (!userRaw) {
    showToast('🔒 Silakan daftar/masuk dulu untuk belanja', 'warning');
    localStorage.setItem('klikva_pending_buy', String(productId));
    setTimeout(() => { window.location.href = 'registerd.html'; }, 1200);
    return;
  }

  let user;
  try { user = JSON.parse(userRaw); } catch (e) { user = null; }
  if (!user || !user.email) {
    showToast('🔒 Silakan daftar/masuk dulu', 'warning');
    setTimeout(() => { window.location.href = 'registerd.html'; }, 1200);
    return;
  }

  const profileRaw = localStorage.getItem('klikva_profile');
  if (profileRaw) {
    try {
      const profile = JSON.parse(profileRaw);
      if (profile.whatsapp && profile.kota && profile.alamat) {
        addToCartAnimated(productId, btnEl, qty);
        return;
      }
    } catch (e) {}
  }

  showToast('🔍 Memeriksa profil...', 'info');
  authCall({ action: 'getProfile', email: user.email }, function(err, result) {
    if (!err && result && result.success && result.isComplete) {
      const profileObj = {
        whatsapp: result.profile.whatsapp,
        kota: result.profile.kota,
        alamat: result.profile.alamatLengkap,
        kecamatan: result.profile.kecamatan,
        kodePos: result.profile.kodePos
      };
      localStorage.setItem('klikva_profile', JSON.stringify(profileObj));
      addToCartAnimated(productId, btnEl, qty);
      return;
    }
    openProfileModal(productId, qty);
  });
}

/* =================================================================
   MODAL PROFIL
================================================================= */
function openProfileModal(productId, qty) {
  pendingProductId = productId;
  pendingQty = qty || 1;
  const modal = document.getElementById('profileModal');
  modal.classList.add('show');
  document.body.style.overflow = 'hidden';

  const userRaw = localStorage.getItem('klikva_user');
  if (userRaw) {
    try {
      const u = JSON.parse(userRaw);
      if (u.whatsapp) document.getElementById('pfWhatsapp').value = u.whatsapp;
      if (u.kota)     document.getElementById('pfKota').value     = u.kota;
    } catch (e) {}
  }

  setTimeout(() => document.getElementById('pfWhatsapp').focus(), 350);
}

function closeProfileModal() {
  const modal = document.getElementById('profileModal');
  modal.classList.remove('show');
  document.body.style.overflow = '';
  pendingProductId = null;
  pendingQty = 1;
  document.querySelectorAll('.pf-group input, .pf-group textarea').forEach(el => el.classList.remove('error'));
  document.getElementById('profileForm').reset();
}

document.addEventListener('DOMContentLoaded', function() {
  const form = document.getElementById('profileForm');
  if (!form) return;

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const whatsapp = document.getElementById('pfWhatsapp').value.trim();
    const kota     = document.getElementById('pfKota').value.trim();
    const alamat   = document.getElementById('pfAlamat').value.trim();
    const kecamatan= document.getElementById('pfKecamatan').value.trim();
    const kodePos  = document.getElementById('pfKodePos').value.trim();
    const btn      = document.getElementById('pfSubmitBtn');

    const errors = [];
    document.querySelectorAll('.pf-group input, .pf-group textarea').forEach(el => el.classList.remove('error'));

    if (!whatsapp) { document.getElementById('pfWhatsapp').classList.add('error'); errors.push('WhatsApp'); }
    else if (!/^[0-9+\-\s]{9,15}$/.test(whatsapp.replace(/\s/g, ''))) {
      document.getElementById('pfWhatsapp').classList.add('error'); errors.push('WhatsApp (format salah)');
    }
    if (!kota)      { document.getElementById('pfKota').classList.add('error'); errors.push('Kota'); }
    if (!alamat)    { document.getElementById('pfAlamat').classList.add('error'); errors.push('Alamat'); }
    if (!kecamatan) { document.getElementById('pfKecamatan').classList.add('error'); errors.push('Kecamatan'); }
    if (!kodePos)   { document.getElementById('pfKodePos').classList.add('error'); errors.push('Kode Pos'); }

    if (errors.length > 0) {
      showToast('⚠️ Lengkapi: ' + errors.join(', '), 'warning');
      return;
    }

    const userRaw = localStorage.getItem('klikva_user');
    if (!userRaw) {
      showToast('🔒 Sesi login hilang. Silakan login ulang.', 'error');
      setTimeout(() => { window.location.href = 'registerd.html'; }, 1500);
      return;
    }
    const user = JSON.parse(userRaw);

    btn.disabled = true;
    btn.innerHTML = 'Menyimpan...';

    authCall({
      action: 'updateProfile',
      email: user.email,
      whatsapp: whatsapp,
      kota: kota,
      alamat: alamat,
      kecamatan: kecamatan,
      kode_pos: kodePos
    }, function(err, result) {
      btn.disabled = false;
      btn.innerHTML = 'Simpan & Lanjut Belanja →';

      if (err || !result || !result.success) {
        showToast('❌ Gagal menyimpan: ' + ((result && result.message) || 'Coba lagi'), 'error');
        return;
      }

      const profileData = { whatsapp, kota, alamat, kecamatan, kodePos };
      localStorage.setItem('klikva_profile', JSON.stringify(profileData));
      user.whatsapp = whatsapp;
      user.kota = kota;
      user.alamat = alamat;
      localStorage.setItem('klikva_user', JSON.stringify(user));

      showToast('✅ Profil tersimpan!', 'success');

      const pid = pendingProductId;
      const qty = pendingQty;
      closeProfileModal();
      if (pid) setTimeout(() => addToCartAnimated(pid, null, qty), 400);
    });
  });
});

document.addEventListener('click', (e) => {
  const modal = document.getElementById('profileModal');
  if (modal && modal.classList.contains('show') && e.target === modal) closeProfileModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const modal = document.getElementById('profileModal');
    if (modal && modal.classList.contains('show')) closeProfileModal();
  }
});

/* =================================================================
   INIT
================================================================= */
document.addEventListener('DOMContentLoaded', () => {
  renderNavbarAvatar();
  updateCartBadge();
  loadProductFromUrl();
});
</script>
