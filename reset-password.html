<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Klikva</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F7F5EF;
      font-family: 'Inter', sans-serif;
      color: #111111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .reset-container {
      max-width: 450px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 2rem;
      display: inline-block;
      color: #111;
      text-decoration: none;
    }
    .logo span { font-weight: 400; color: #6B7280; }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #6B7280;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      color: #111;
    }
    .form-group input {
      width: 100%;
      padding: 1rem;
      border: 1.5px solid #EAEAEA;
      border-radius: 1rem;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus {
      border-color: #111;
    }
    .btn-primary {
      width: 100%;
      background: #111;
      color: white;
      padding: 1rem;
      border-radius: 2rem;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    .btn-primary:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }
    .back-link a {
      color: #6B7280;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .message {
      padding: 0.75rem;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }
    .message.success {
      display: block;
      background: #DCFCE7;
      color: #166534;
    }
    .message.error {
      display: block;
      background: #FEE2E2;
      color: #DC2626;
    }
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="reset-container" id="resetContainer">
  <a href="index.html" class="logo">Klikva<span>.</span></a>
  <div id="content">
    <!-- JS akan render di sini -->
  </div>
</div>

<script>
  const MEMBERS_API_URL = 'https://api.sheetbest.com/sheets/37e51cb6-e223-41c8-9454-cd2586557b11';
  
  function showMessage(msg, type) {
    let msgDiv = document.getElementById('message');
    if (!msgDiv) {
      msgDiv = document.createElement('div');
      msgDiv.id = 'message';
      msgDiv.className = 'message';
      document.getElementById('content').prepend(msgDiv);
    }
    msgDiv.textContent = msg;
    msgDiv.className = `message ${type}`;
    msgDiv.style.display = 'block';
    setTimeout(() => {
      if (msgDiv) {
        msgDiv.style.display = 'none';
      }
    }, 5000);
  }
  
  // Cek token valid
  function checkToken() {
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    
    if (!token) {
      document.getElementById('content').innerHTML = `
        <div style="text-align:center; padding:1rem;">
          <p style="color:#DC2626;">❌ Token tidak valid</p>
          <p style="margin-top:1rem;">Link reset password tidak valid atau sudah kadaluarsa.</p>
          <a href="forgot-password.html" style="display:inline-block; margin-top:1rem; color:#111;">Kirim ulang link reset →</a>
        </div>
      `;
      return false;
    }
    
    // Cek token di localStorage
    const resetData = localStorage.getItem('klikva_reset_token');
    if (!resetData) {
      document.getElementById('content').innerHTML = `
        <div style="text-align:center; padding:1rem;">
          <p style="color:#DC2626;">❌ Token tidak valid</p>
          <p style="margin-top:1rem;">Link reset password tidak valid atau sudah kadaluarsa.</p>
          <a href="forgot-password.html" style="display:inline-block; margin-top:1rem; color:#111;">Kirim ulang link reset →</a>
        </div>
      `;
      return false;
    }
    
    const resetObj = JSON.parse(resetData);
    if (resetObj.token !== token) {
      document.getElementById('content').innerHTML = `
        <div style="text-align:center; padding:1rem;">
          <p style="color:#DC2626;">❌ Token tidak valid</p>
          <p style="margin-top:1rem;">Link reset password tidak valid atau sudah kadaluarsa.</p>
          <a href="forgot-password.html" style="display:inline-block; margin-top:1rem; color:#111;">Kirim ulang link reset →</a>
        </div>
      `;
      return false;
    }
    
    if (Date.now() > resetObj.expired) {
      localStorage.removeItem('klikva_reset_token');
      document.getElementById('content').innerHTML = `
        <div style="text-align:center; padding:1rem;">
          <p style="color:#DC2626;">⏰ Token sudah kadaluarsa</p>
          <p style="margin-top:1rem;">Link reset password sudah kadaluarsa (1 jam).</p>
          <a href="forgot-password.html" style="display:inline-block; margin-top:1rem; color:#111;">Kirim ulang link reset →</a>
        </div>
      `;
      return false;
    }
    
    return { token, email: resetObj.email };
  }
  
  // Update password ke API
  async function updatePasswordToAPI(email, newPassword) {
    try {
      // Ambil semua data
      const response = await fetch(MEMBERS_API_URL);
      const members = await response.json();
      
      // Cari member berdasarkan email
      const member = members.find(m => m.email?.toLowerCase() === email.toLowerCase());
      if (!member) {
        return { success: false, message: 'Email tidak ditemukan' };
      }
      
      // Update password
      const updateResponse = await fetch(`${MEMBERS_API_URL}/email/${encodeURIComponent(email)}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: newPassword })
      });
      
      if (updateResponse.ok) {
        return { success: true, message: 'Password berhasil diupdate' };
      } else {
        return { success: false, message: 'Gagal update password' };
      }
    } catch (error) {
      console.error('Error updating password:', error);
      return { success: false, message: 'Koneksi error' };
    }
  }
  
  // Update password di localStorage
  function updatePasswordToLocalStorage(email, newPassword) {
    // Update di klikva_all_members
    let allMembers = JSON.parse(localStorage.getItem('klikva_all_members') || '[]');
    const memberIndex = allMembers.findIndex(m => m.email?.toLowerCase() === email.toLowerCase());
    if (memberIndex !== -1) {
      allMembers[memberIndex].password = newPassword;
      localStorage.setItem('klikva_all_members', JSON.stringify(allMembers));
    }
    
    // Update di klikva_user (jika sedang login)
    const currentUser = localStorage.getItem('klikva_user');
    if (currentUser) {
      const user = JSON.parse(currentUser);
      if (user.email?.toLowerCase() === email.toLowerCase()) {
        user.password = newPassword;
        localStorage.setItem('klikva_user', JSON.stringify(user));
      }
    }
  }
  
  async function resetPassword() {
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('resetBtn');
    
    if (newPassword.length < 6) {
      showMessage('Password minimal 6 karakter!', 'error');
      return;
    }
    
    if (newPassword !== confirmPassword) {
      showMessage('Password dan konfirmasi password tidak cocok!', 'error');
      return;
    }
    
    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span> Menyimpan...';
    
    try {
      const resetData = localStorage.getItem('klikva_reset_token');
      if (!resetData) {
        showMessage('Session expired. Silakan kirim ulang link reset.', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Reset Password →';
        return;
      }
      
      const resetObj = JSON.parse(resetData);
      const email = resetObj.email;
      
      // Update ke API
      const apiResult = await updatePasswordToAPI(email, newPassword);
      
      if (apiResult.success) {
        // Update ke localStorage
        updatePasswordToLocalStorage(email, newPassword);
        
        // Hapus token reset
        localStorage.removeItem('klikva_reset_token');
        
        showMessage('✅ Password berhasil diubah! Mengarahkan ke halaman login...', 'success');
        
        setTimeout(() => {
          window.location.href = 'registerd.html';
        }, 2000);
      } else {
        showMessage(apiResult.message, 'error');
        btn.disabled = false;
        btn.innerHTML = 'Reset Password →';
      }
    } catch (error) {
      console.error('Error:', error);
      showMessage('Terjadi kesalahan. Silakan coba lagi.', 'error');
      btn.disabled = false;
      btn.innerHTML = 'Reset Password →';
    }
  }
  
  function renderResetForm() {
    document.getElementById('content').innerHTML = `
      <h1>Buat Password Baru</h1>
      <p class="subtitle">Masukkan password baru untuk akun Anda</p>
      <div id="message"></div>
      <div class="form-group">
        <label>Password Baru</label>
        <input type="password" id="newPassword" placeholder="Minimal 6 karakter">
      </div>
      <div class="form-group">
        <label>Konfirmasi Password</label>
        <input type="password" id="confirmPassword" placeholder="Masukkan ulang password baru">
      </div>
      <button class="btn-primary" id="resetBtn">Reset Password →</button>
      <div class="back-link">
        <a href="login.html">← Kembali ke Login</a>
      </div>
    `;
    
    document.getElementById('resetBtn').addEventListener('click', resetPassword);
    
    // Enter key support
    document.getElementById('newPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') resetPassword();
    });
    document.getElementById('confirmPassword').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') resetPassword();
    });
  }
  
  // Initialize
  const validToken = checkToken();
  if (validToken && typeof validToken === 'object') {
    renderResetForm();
  }
</script>
</body>
</html>
