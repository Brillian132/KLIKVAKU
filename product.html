<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Detail — Klikva Fashion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F7F5EF;
      font-family: 'Inter', sans-serif;
      color: #111111;
    }

    .navbar {
      background: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #EAEAEA;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #111;
      text-decoration: none;
    }
    .logo span { font-weight: 400; color: #6B7280; }
    .nav-icons {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    .icon-btn {
      background: none;
      border: none;
      font-size: 1.25rem;
      cursor: pointer;
      position: relative;
    }
    .cart-count {
      position: absolute;
      top: -8px;
      right: -12px;
      background: #111;
      color: white;
      font-size: 0.7rem;
      padding: 0.15rem 0.4rem;
      border-radius: 50%;
    }
    .avatar {
      width: 36px;
      height: 36px;
      background: #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .product-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }
    .product-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
    }

    .product-gallery {
      position: relative;
    }
    .main-image {
      background: white;
      border-radius: 1.5rem;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 8rem;
      border: 1px solid #EAEAEA;
      margin-bottom: 1rem;
    }
    .thumbnail-grid {
      display: flex;
      gap: 0.5rem;
    }
    .thumbnail {
      width: 80px;
      height: 80px;
      background: white;
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .thumbnail.active {
      border-color: #111;
    }
    .thumbnail:hover {
      border-color: #111;
    }

    .product-info {
      background: white;
      border-radius: 1.5rem;
      padding: 2rem;
      border: 1px solid #EAEAEA;
    }
    .product-category {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: #6B7280;
      margin-bottom: 0.5rem;
    }
    .product-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    .product-rating {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .stars {
      color: #FBBF24;
    }
    .reviews {
      font-size: 0.8rem;
      color: #6B7280;
    }
    .product-price {
      margin-bottom: 1rem;
    }
    .current-price {
      font-size: 1.75rem;
      font-weight: 800;
    }
    .old-price {
      font-size: 1rem;
      color: #9CA3AF;
      text-decoration: line-through;
      margin-left: 0.5rem;
    }
    .discount {
      background: #FEE2E2;
      color: #DC2626;
      padding: 0.2rem 0.5rem;
      border-radius: 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
      margin-left: 0.5rem;
    }
    
    .stock-info {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      padding: 0.75rem;
      background: #F7F5EF;
      border-radius: 1rem;
    }
    .stock-badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .stock-high { background: #DCFCE7; color: #166534; }
    .stock-medium { background: #FEF3C7; color: #D97706; }
    .stock-low { background: #FEE2E2; color: #DC2626; }
    
    .size-section {
      margin-bottom: 1.5rem;
    }
    .size-title {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .size-options {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .size-btn {
      background: white;
      border: 1.5px solid #EAEAEA;
      padding: 0.5rem 1rem;
      border-radius: 2rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .size-btn:hover, .size-btn.selected {
      background: #111;
      color: white;
      border-color: #111;
    }
    
    .quantity-section {
      margin-bottom: 1.5rem;
    }
    .quantity-selector {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 0.5rem;
    }
    .qty-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1.5px solid #EAEAEA;
      background: white;
      cursor: pointer;
      font-size: 1.2rem;
    }
    .qty-value {
      font-size: 1.2rem;
      font-weight: 600;
      min-width: 40px;
      text-align: center;
    }
    
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
    }
    .add-to-cart-btn {
      background: #111;
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 2rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    .buy-now-btn {
      background: white;
      color: #111;
      border: 1.5px solid #111;
      padding: 1rem;
      border-radius: 2rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }
    .wishlist-btn {
      background: white;
      border: 1px solid #EAEAEA;
      padding: 1rem;
      border-radius: 2rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s;
    }
    .wishlist-btn:hover {
      background: #FEE2E2;
      border-color: #DC2626;
    }
    .wishlist-btn.active {
      background: #DC2626;
      border-color: #DC2626;
      color: white;
    }
    
    .product-description {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid #EAEAEA;
    }
    .product-description h4 {
      margin-bottom: 0.5rem;
    }
    .product-description p {
      color: #6B7280;
      line-height: 1.6;
    }

    .review-section {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 2px solid #EAEAEA;
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .average-rating {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .avg-score {
      font-size: 2rem;
      font-weight: 800;
    }
    .avg-stars {
      font-size: 0.9rem;
      color: #FBBF24;
    }
    .total-reviews {
      font-size: 0.8rem;
      color: #6B7280;
    }
    .rating-stars {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }
    .star {
      font-size: 1.5rem;
      cursor: pointer;
      color: #EAEAEA;
      transition: color 0.2s;
    }
    .star.active, .star:hover {
      color: #FBBF24;
    }
    .review-form {
      background: #F7F5EF;
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .review-form textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1.5px solid #EAEAEA;
      border-radius: 1rem;
      font-family: 'Inter', sans-serif;
      resize: vertical;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    .review-form textarea:focus {
      outline: none;
      border-color: #111;
    }
    .submit-review-btn {
      background: #111;
      color: white;
      border: none;
      padding: 0.5rem 1.5rem;
      border-radius: 2rem;
      cursor: pointer;
      font-weight: 600;
      margin-top: 0.5rem;
      transition: all 0.2s;
    }
    .submit-review-btn:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }
    .review-list {
      margin-top: 1rem;
    }
    .review-item {
      background: #F7F5EF;
      border-radius: 1rem;
      padding: 1rem;
      margin-bottom: 1rem;
    }
    .review-name {
      font-weight: 700;
      font-size: 0.8rem;
    }
    .review-rating {
      color: #FBBF24;
      font-size: 0.8rem;
    }
    .review-text {
      font-size: 0.85rem;
      color: #4B5563;
      line-height: 1.5;
      margin-bottom: 0.5rem;
    }
    .review-date {
      font-size: 0.7rem;
      color: #6B7280;
    }
    .no-reviews {
      text-align: center;
      padding: 2rem;
      color: #6B7280;
    }
    .login-to-review {
      text-align: center;
      padding: 1rem;
      background: #F7F5EF;
      border-radius: 1rem;
      margin-bottom: 1rem;
    }
    
    .back-link {
      display: inline-block;
      margin-bottom: 1.5rem;
      color: #6B7280;
      text-decoration: none;
    }
    .back-link:hover {
      color: #111;
    }
    
    .toast-msg {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 2rem;
      font-size: 0.875rem;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast-msg.show {
      opacity: 1;
    }

    @media (max-width: 900px) {
      .product-grid { grid-template-columns: 1fr; gap: 1.5rem; }
      .product-container { padding: 1rem; }
      .review-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="logo">Klikva<span>.</span></a>
  <div class="nav-icons">
    <button class="icon-btn" onclick="window.location.href='shop.html'">🛍️</button>
    <button class="icon-btn" onclick="window.location.href='wishlist.html'">❤️</button>
    <button class="icon-btn" onclick="window.location.href='cart.html'">
      🛒 <span class="cart-count" id="cartCount">0</span>
    </button>
    <div class="avatar" id="avatarDisplay" onclick="window.location.href='dashboard.html'">👤</div>
  </div>
</nav>

<div class="product-container" id="productContainer"></div>
<div class="toast-msg" id="toastMsg"></div>

<script>
  // ======================== STORAGE KEYS ========================
  const WISHLIST_STORAGE_KEY = 'klikva_wishlist_data';
  const REVIEWS_STORAGE_KEY = 'klikva_reviews_data';
  
  // ======================== DATA PRODUK ========================
  const products = [
    { id: 1, name: "Regular Boot Lunch Shirt - Sage Green", category: "CLOTHING", price: 795000, oldPrice: 1200000, discount: "34%", rating: 4.5, reviews: 1100, image: "👔", images: ["👔", "👕", "👔"], description: "Premium cotton shirt with regular fit. Perfect for casual and formal occasions. Made from high-quality materials.", sizes: ["S", "M", "L", "XL"], stock: 15, gender: "MEN" },
    { id: 5, name: "Premium Cotton Hoodie - Oversized", category: "CLOTHING", price: 299000, oldPrice: 499000, discount: "40%", rating: 4.7, reviews: 890, image: "🧥", images: ["🧥", "🧥", "🧥"], description: "Oversized hoodie made from premium cotton blend. Super comfortable and stylish.", sizes: ["S", "M", "L", "XL"], stock: 8, gender: "UNISEX" },
    { id: 13, name: "Plain White T-Shirt - 3 Pack", category: "CLOTHING", price: 149000, oldPrice: 249000, discount: "40%", rating: 4.6, reviews: 3200, image: "👕", images: ["👕", "👕", "👕"], description: "3-pack plain white t-shirts. 100% cotton, breathable, and comfortable for daily wear.", sizes: ["S", "M", "L", "XL"], stock: 45, gender: "MEN" },
    { id: 7, name: "Floral Summer Dress", category: "CLOTHING", price: 189000, oldPrice: 350000, discount: "46%", rating: 4.6, reviews: 2340, image: "👗", images: ["👗", "👗", "👗"], description: "Beautiful floral summer dress. Lightweight and perfect for sunny days.", sizes: ["S", "M", "L"], stock: 12, gender: "WOMEN" },
    { id: 8, name: "Minimalist Tote Bag", category: "ACCESSORIES", price: 159000, oldPrice: 299000, discount: "47%", rating: 4.5, reviews: 1200, image: "👜", images: ["👜", "👜", "👜"], description: "Minimalist tote bag made from recycled canvas. Spacious and eco-friendly.", sizes: ["One Size"], stock: 23, gender: "WOMEN" },
    { id: 6, name: "Leather Sneakers - Limited Edition", category: "SNEAKERS", price: 450000, oldPrice: 750000, discount: "40%", rating: 4.8, reviews: 560, image: "👟", images: ["👟", "👟", "👟"], description: "Limited edition leather sneakers. Premium quality with comfortable sole.", sizes: ["40", "41", "42", "43", "44"], stock: 5, gender: "MEN" }
  ];

  let currentProduct = null;
  let selectedSize = '';
  let quantity = 1;
  let selectedRating = 0;
  let currentUser = null;

  function showToast(msg) {
    const toast = document.getElementById('toastMsg');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function getProductIdFromUrl() {
    const params = new URLSearchParams(window.location.search);
    return parseInt(params.get('id'));
  }

  // Cart Functions
  function getCart() {
    return JSON.parse(localStorage.getItem('klikva_cart') || '[]');
  }

  function saveCart(cart) {
    localStorage.setItem('klikva_cart', JSON.stringify(cart));
    updateCartCount();
  }

  function updateCartCount() {
    const cart = getCart();
    const total = cart.reduce((sum, item) => sum + item.quantity, 0);
    const cartCountElem = document.getElementById('cartCount');
    if (cartCountElem) cartCountElem.innerText = total;
  }

  function addToCart(product, qty, size) {
    if (!currentUser) {
      if (confirm('Anda harus login terlebih dahulu. Buka halaman login?')) {
        window.location.href = 'login.html';
      }
      return false;
    }
    
    const cart = getCart();
    const existing = cart.find(item => item.id === product.id && item.size === size);
    
    if (existing) {
      existing.quantity += qty;
    } else {
      cart.push({
        id: product.id,
        name: product.name,
        price: product.price,
        image: product.image,
        quantity: qty,
        size: size
      });
    }
    
    saveCart(cart);
    return true;
  }

  function getStockClass(stock) {
    if (stock > 20) return 'stock-high';
    if (stock > 5) return 'stock-medium';
    return 'stock-low';
  }

  function getStockText(stock) {
    if (stock > 20) return 'Tersedia';
    if (stock > 5) return 'Stok terbatas';
    if (stock > 0) return 'Hampir habis!';
    return 'Stok habis';
  }

  // ======================== WISHLIST FUNCTIONS ========================
  function isInWishlist(productId) {
    if (!currentUser) return false;
    const allWishlist = JSON.parse(localStorage.getItem(WISHLIST_STORAGE_KEY) || '[]');
    return allWishlist.some(w => w.customerEmail === currentUser.email && w.productId === productId);
  }

  function toggleWishlist() {
    if (!currentUser) {
      if (confirm('Login dulu untuk menyimpan wishlist?')) {
        window.location.href = 'login.html';
      }
      return;
    }
    
    const allWishlist = JSON.parse(localStorage.getItem(WISHLIST_STORAGE_KEY) || '[]');
    const exists = allWishlist.find(w => w.customerEmail === currentUser.email && w.productId === currentProduct.id);
    const btn = document.getElementById('wishlistBtn');
    
    if (exists) {
      const newWishlist = allWishlist.filter(w => w.wishlistId !== exists.wishlistId);
      localStorage.setItem(WISHLIST_STORAGE_KEY, JSON.stringify(newWishlist));
      showToast('❤️ Dihapus dari wishlist');
      if (btn) {
        btn.classList.remove('active');
        btn.innerHTML = '❤️ Wishlist';
      }
    } else {
      const newItem = {
        wishlistId: `WL-${Date.now()}-${Math.random()}`,
        customerEmail: currentUser.email,
        customerName: currentUser.namaLengkap,
        productId: currentProduct.id,
        productName: currentProduct.name,
        productPrice: currentProduct.price,
        productImage: currentProduct.image,
        addedAt: new Date().toLocaleString('id-ID')
      };
      allWishlist.push(newItem);
      localStorage.setItem(WISHLIST_STORAGE_KEY, JSON.stringify(allWishlist));
      showToast('✅ Disimpan ke wishlist!');
      if (btn) {
        btn.classList.add('active');
        btn.innerHTML = '❤️ Saved';
      }
    }
  }

  // ======================== REVIEW FUNCTIONS ========================
  function loadReviews() {
    const allReviews = JSON.parse(localStorage.getItem(REVIEWS_STORAGE_KEY) || '[]');
    const productReviews = allReviews.filter(r => r.productId == currentProduct.id);
    
    const totalRating = productReviews.reduce((sum, r) => sum + parseInt(r.rating), 0);
    const avgRating = productReviews.length > 0 ? (totalRating / productReviews.length).toFixed(1) : 0;
    
    const avgScoreElem = document.getElementById('avgScore');
    const avgStarsElem = document.getElementById('avgStars');
    const totalReviewsElem = document.getElementById('totalReviews');
    
    if (avgScoreElem) avgScoreElem.innerHTML = avgRating;
    if (avgStarsElem) avgStarsElem.innerHTML = '★'.repeat(Math.floor(avgRating)) + '☆'.repeat(5 - Math.floor(avgRating));
    if (totalReviewsElem) totalReviewsElem.innerHTML = `${productReviews.length} ulasan`;
    
    const reviewList = document.getElementById('reviewList');
    if (!reviewList) return;
    
    if (productReviews.length === 0) {
      reviewList.innerHTML = '<div class="no-reviews">✨ Belum ada ulasan. Jadi yang pertama!</div>';
      return;
    }
    
    reviewList.innerHTML = productReviews.map(r => `
      <div class="review-item">
        <div class="review-name">${r.customerName}</div>
        <div class="review-rating">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>
        <div class="review-text">${r.review}</div>
        <div class="review-date">📅 ${r.date || '-'}</div>
      </div>
    `).join('');
  }

  function renderStarRating() {
    const starsContainer = document.getElementById('ratingStars');
    if (!starsContainer) return;
    
    starsContainer.innerHTML = '';
    for (let i = 1; i <= 5; i++) {
      const star = document.createElement('span');
      star.className = `star ${selectedRating >= i ? 'active' : ''}`;
      star.innerHTML = '★';
      star.onclick = () => {
        selectedRating = i;
        renderStarRating();
      };
      starsContainer.appendChild(star);
    }
  }

  function submitReview() {
    if (!currentUser) {
      alert('Silakan login terlebih dahulu untuk memberikan review');
      window.location.href = 'login.html';
      return;
    }
    
    const reviewText = document.getElementById('reviewText')?.value.trim();
    
    if (selectedRating === 0) {
      alert('Pilih rating bintang terlebih dahulu');
      return;
    }
    
    if (!reviewText) {
      alert('Tulis review Anda terlebih dahulu');
      return;
    }
    
    const newReview = {
      reviewId: `R-${Date.now()}-${Math.random()}`,
      productId: currentProduct.id,
      productName: currentProduct.name,
      customerName: currentUser.namaLengkap,
      customerEmail: currentUser.email,
      rating: selectedRating,
      review: reviewText,
      date: new Date().toLocaleString('id-ID', { timeZone: 'Asia/Jakarta' })
    };
    
    const allReviews = JSON.parse(localStorage.getItem(REVIEWS_STORAGE_KEY) || '[]');
    allReviews.push(newReview);
    localStorage.setItem(REVIEWS_STORAGE_KEY, JSON.stringify(allReviews));
    
    alert('✅ Review terkirim! Terima kasih atas masukan Anda.');
    document.getElementById('reviewText').value = '';
    selectedRating = 0;
    renderStarRating();
    loadReviews();
  }

  function formatRupiah(angka) {
    return 'Rp ' + (angka || 0).toLocaleString('id-ID');
  }

  // ======================== RENDER PRODUCT ========================
  function renderProduct() {
    const productId = getProductIdFromUrl();
    currentProduct = products.find(p => p.id === productId);
    
    if (!currentProduct) {
      document.getElementById('productContainer').innerHTML = `
        <div style="text-align:center; padding:3rem;">
          <h2>Product not found</h2>
          <a href="shop.html" class="back-link">← Back to Shop</a>
        </div>
      `;
      return;
    }

    const stockClass = getStockClass(currentProduct.stock);
    const stockText = getStockText(currentProduct.stock);
    const isOutOfStock = currentProduct.stock === 0;
    const inWishlist = isInWishlist(currentProduct.id);

    const container = document.getElementById('productContainer');
    container.innerHTML = `
      <a href="shop.html" class="back-link">← Back to Shop</a>
      
      <div class="product-grid">
        <div class="product-gallery">
          <div class="main-image" id="mainImage">${currentProduct.image}</div>
          <div class="thumbnail-grid" id="thumbnailGrid">
            ${currentProduct.images.map((img, idx) => `
              <div class="thumbnail ${idx === 0 ? 'active' : ''}" onclick="changeMainImage(${idx})">${img}</div>
            `).join('')}
          </div>
        </div>
        
        <div class="product-info">
          <div class="product-category">${currentProduct.category} • ${currentProduct.gender}</div>
          <h1 class="product-title">${currentProduct.name}</h1>
          <div class="product-rating">
            <div class="stars">${'★'.repeat(Math.floor(currentProduct.rating))}${'☆'.repeat(5-Math.floor(currentProduct.rating))}</div>
            <div class="reviews">(${currentProduct.reviews} reviews)</div>
          </div>
          <div class="product-price">
            <span class="current-price">${formatRupiah(currentProduct.price)}</span>
            <span class="old-price">${formatRupiah(currentProduct.oldPrice)}</span>
            <span class="discount">${currentProduct.discount}</span>
          </div>
          
          <div class="stock-info">
            <span>📦 Stock:</span>
            <span class="stock-badge ${stockClass}">${stockText} (${currentProduct.stock} left)</span>
          </div>
          
          <div class="size-section">
            <div class="size-title">Select Size</div>
            <div class="size-options" id="sizeOptions">
              ${currentProduct.sizes.map(size => `
                <button class="size-btn" onclick="selectSize('${size}')">${size}</button>
              `).join('')}
            </div>
          </div>
          
          <div class="quantity-section">
            <div class="size-title">Quantity</div>
            <div class="quantity-selector">
              <button class="qty-btn" onclick="changeQuantity(-1)" ${isOutOfStock ? 'disabled' : ''}>-</button>
              <span class="qty-value" id="qtyValue">${quantity}</span>
              <button class="qty-btn" onclick="changeQuantity(1)" ${isOutOfStock ? 'disabled' : ''}>+</button>
            </div>
          </div>
          
          <div class="action-buttons">
            <button class="add-to-cart-btn" id="addToCartBtn" ${isOutOfStock ? 'disabled' : ''} onclick="handleAddToCart()">
              ${isOutOfStock ? 'Out of Stock' : 'Add to Cart'}
            </button>
            <button class="buy-now-btn" ${isOutOfStock ? 'disabled' : ''} onclick="handleBuyNow()">
              Buy Now
            </button>
            <button class="wishlist-btn ${inWishlist ? 'active' : ''}" id="wishlistBtn" onclick="toggleWishlist()">
              ${inWishlist ? '❤️ Saved' : '❤️ Wishlist'}
            </button>
          </div>
          
          <div class="product-description">
            <h4>Product Description</h4>
            <p>${currentProduct.description || 'High-quality product from Klikva. Designed with premium materials and attention to detail.'}</p>
          </div>
        </div>
      </div>
      
      <div class="review-section">
        <div class="review-header">
          <div class="average-rating">
            <span class="avg-score" id="avgScore">0</span>
            <div>
              <div class="avg-stars" id="avgStars">☆☆☆☆☆</div>
              <div class="total-reviews" id="totalReviews">0 ulasan</div>
            </div>
          </div>
        </div>
        
        ${currentUser ? `
          <div class="review-form">
            <div class="rating-stars" id="ratingStars"></div>
            <textarea id="reviewText" rows="3" placeholder="Tulis review Anda..."></textarea>
            <button class="submit-review-btn" onclick="submitReview()">Kirim Review</button>
          </div>
        ` : `
          <div class="login-to-review">
            🔐 <a href="login.html" style="color:#111; font-weight:600;">Login</a> untuk memberikan review
          </div>
        `}
        
        <div class="review-list" id="reviewList">
          <div class="no-reviews">⏳ Memuat ulasan...</div>
        </div>
      </div>
    `;
    
    if (selectedSize) {
      const sizeBtns = document.querySelectorAll('.size-btn');
      sizeBtns.forEach(btn => {
        if (btn.innerText === selectedSize) {
          btn.classList.add('selected');
        }
      });
    }
    
    renderStarRating();
    loadReviews();
  }

  function changeMainImage(index) {
    const mainImage = document.getElementById('mainImage');
    const thumbnails = document.querySelectorAll('.thumbnail');
    
    if (mainImage && currentProduct) {
      mainImage.innerHTML = currentProduct.images[index];
      thumbnails.forEach((thumb, i) => {
        if (i === index) {
          thumb.classList.add('active');
        } else {
          thumb.classList.remove('active');
        }
      });
    }
  }

  function selectSize(size) {
    selectedSize = size;
    const sizeBtns = document.querySelectorAll('.size-btn');
    sizeBtns.forEach(btn => {
      if (btn.innerText === size) {
        btn.classList.add('selected');
      } else {
        btn.classList.remove('selected');
      }
    });
  }

  function changeQuantity(delta) {
    const newQty = quantity + delta;
    if (newQty >= 1 && newQty <= currentProduct.stock) {
      quantity = newQty;
      document.getElementById('qtyValue').innerText = quantity;
    } else if (newQty > currentProduct.stock) {
      alert(`Sorry, only ${currentProduct.stock} items available in stock.`);
    }
  }

  function handleAddToCart() {
    if (!currentUser) {
      if (confirm('Anda harus login terlebih dahulu. Buka halaman login?')) {
        window.location.href = 'login.html';
      }
      return;
    }
    
    if (!selectedSize && currentProduct.sizes.length > 0 && currentProduct.sizes[0] !== 'One Size') {
      alert('Please select a size first');
      return;
    }
    
    const sizeToUse = selectedSize || (currentProduct.sizes[0] === 'One Size' ? 'One Size' : currentProduct.sizes[0]);
    addToCart(currentProduct, quantity, sizeToUse);
    
    const btn = document.getElementById('addToCartBtn');
    const originalText = btn.innerText;
    btn.innerText = '✓ Added to Cart!';
    btn.style.background = '#10B981';
    setTimeout(() => {
      btn.innerText = originalText;
      btn.style.background = '#111';
    }, 1500);
  }

  function handleBuyNow() {
    if (!currentUser) {
      if (confirm('Anda harus login terlebih dahulu. Buka halaman login?')) {
        window.location.href = 'login.html';
      }
      return;
    }
    
    if (!selectedSize && currentProduct.sizes.length > 0 && currentProduct.sizes[0] !== 'One Size') {
      alert('Please select a size first');
      return;
    }
    
    const sizeToUse = selectedSize || (currentProduct.sizes[0] === 'One Size' ? 'One Size' : currentProduct.sizes[0]);
    addToCart(currentProduct, quantity, sizeToUse);
    window.location.href = 'cart.html';
  }

  // Initialize
  const userData = localStorage.getItem('klikva_user');
  if (userData) {
    currentUser = JSON.parse(userData);
    const initial = (currentUser.namaLengkap || 'M').charAt(0).toUpperCase();
    document.getElementById('avatarDisplay').innerHTML = initial;
  }

  renderProduct();
  updateCartCount();
</script>
</body>
</html>
