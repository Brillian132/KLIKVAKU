<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password — Klikva</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #F7F5EF;
      font-family: 'Inter', sans-serif;
      color: #111111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .forgot-container {
      max-width: 450px;
      width: 100%;
      background: white;
      border-radius: 2rem;
      padding: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15);
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 2rem;
      display: inline-block;
      color: #111;
      text-decoration: none;
    }
    .logo span { font-weight: 400; color: #6B7280; }
    h1 {
      font-size: 1.75rem;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: #6B7280;
      margin-bottom: 2rem;
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      margin-bottom: 0.5rem;
      color: #111;
    }
    .form-group input {
      width: 100%;
      padding: 1rem;
      border: 1.5px solid #EAEAEA;
      border-radius: 1rem;
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus {
      border-color: #111;
    }
    .btn-primary {
      width: 100%;
      background: #111;
      color: white;
      padding: 1rem;
      border-radius: 2rem;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 0.5rem;
    }
    .btn-primary:hover {
      opacity: 0.85;
      transform: scale(1.02);
    }
    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .back-link {
      text-align: center;
      margin-top: 1.5rem;
    }
    .back-link a {
      color: #6B7280;
      text-decoration: none;
      font-size: 0.875rem;
    }
    .back-link a:hover {
      color: #111;
    }
    .message {
      padding: 0.75rem;
      border-radius: 0.75rem;
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }
    .message.success {
      display: block;
      background: #DCFCE7;
      color: #166534;
    }
    .message.error {
      display: block;
      background: #FEE2E2;
      color: #DC2626;
    }
    .loading-spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div class="forgot-container">
  <a href="index.html" class="logo">Klikva<span>.</span></a>
  <h1>Lupa Password?</h1>
  <p class="subtitle">Masukkan email yang terdaftar untuk mereset password</p>
  
  <div id="message" class="message"></div>
  
  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="your@email.com">
  </div>
  
  <button class="btn-primary" id="sendBtn">Verifikasi Email →</button>
  
  <div class="back-link">
    <a href="login.html">← Kembali ke Login</a>
  </div>
</div>

<script>
  function showMessage(msg, type) {
    const msgDiv = document.getElementById('message');
    msgDiv.textContent = msg;
    msgDiv.className = `message ${type}`;
    msgDiv.style.display = 'block';
    setTimeout(() => {
      msgDiv.style.display = 'none';
    }, 5000);
  }
  
  // Data member sementara (karena API sering error)
  // Ini adalah data dari register.html sebelumnya
  const DEFAULT_MEMBERS = [
    { email: "brillian.wicaksono23@gmail.com", namaLengkap: "Brillian Wicaksono", memberId: "KLV-20260609-319" },
    { email: "brillian.wicaksono04@gmail.com", namaLengkap: "Brillian Wicaksono", memberId: "KLV-20260609-1855" },
    { email: "test@klikva.com", namaLengkap: "Test User", memberId: "KLV-20260609-1234" }
  ];
  
  function sendResetLink() {
    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('sendBtn');
    const originalText = btn.innerHTML;
    
    if (!email) {
      showMessage('Masukkan email Anda', 'error');
      return;
    }
    
    btn.disabled = true;
    btn.innerHTML = '<span class="loading-spinner"></span> Memverifikasi...';
    
    // Cek dari localStorage (data member yang login)
    let memberFound = null;
    
    // 1. Cek dari klikva_user (user yang sedang login)
    const currentUser = localStorage.getItem('klikva_user');
    if (currentUser) {
      const user = JSON.parse(currentUser);
      if (user.email && user.email.toLowerCase() === email.toLowerCase()) {
        memberFound = user;
      }
    }
    
    // 2. Cek dari klikva_all_members (semua member)
    if (!memberFound) {
      const allMembers = localStorage.getItem('klikva_all_members');
      if (allMembers) {
        const members = JSON.parse(allMembers);
        memberFound = members.find(m => m.email && m.email.toLowerCase() === email.toLowerCase());
      }
    }
    
    // 3. Cek dari DEFAULT_MEMBERS (fallback)
    if (!memberFound) {
      memberFound = DEFAULT_MEMBERS.find(m => m.email.toLowerCase() === email.toLowerCase());
    }
    
    if (!memberFound) {
      showMessage('❌ Email tidak terdaftar. Pastikan email yang Anda masukkan sudah terdaftar.', 'error');
      btn.disabled = false;
      btn.innerHTML = originalText;
      return;
    }
    
    // Buat token reset
    const resetToken = btoa(`${email}_${Date.now()}_reset`);
    
    // Simpan token ke localStorage
    const resetData = {
      email: email,
      token: resetToken,
      expired: Date.now() + 3600000
    };
    localStorage.setItem('klikva_reset_token', JSON.stringify(resetData));
    
    showMessage('✅ Email terverifikasi! Mengarahkan ke halaman reset password...', 'success');
    
    setTimeout(() => {
      window.location.href = `reset-password.html?token=${encodeURIComponent(resetToken)}`;
    }, 1500);
  }
  
  document.getElementById('sendBtn').addEventListener('click', sendResetLink);
  document.getElementById('email').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendResetLink();
  });
</script>
</body>
</html>
